name: sp_smart
description: SP Smart Broadcast — Mobile Reporter App (Android/iOS)
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ───────────────────────────────────────
  flutter_riverpod: ^2.6.1
  
  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.6.2

  # ── WebRTC (IFB / Video Return) ───────────────────────────
  # flutter_webrtc wraps libwebrtc natively (no browser dependency)
  flutter_webrtc: 0.12.12+hotfix.1

  # ── WebSocket (Signaling) ─────────────────────────────────
  web_socket_channel: ^3.0.1

  # ── Camera ────────────────────────────────────────────────
  # camera plugin gives us raw access; we wrap Camera2API/AVFoundation
  # through our native SRT engine (see android/ios plugin dirs)
  camera: ^0.11.1

  # ── Native FFI / Method Channels (SRT engine) ─────────────
  ffi: ^2.1.3
  plugin_platform_interface: ^2.1.8

  # ── Audio (IFB headphone output) ──────────────────────────
  just_audio: ^0.10.2

  # ── Utilities ────────────────────────────────────────────
  uuid: ^4.5.1
  crypto: ^3.0.6
  equatable: ^2.0.7
  freezed_annotation: any
  json_annotation: ^4.9.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.1
  battery_plus: ^6.0.3
  wakelock_plus: ^1.2.10
  logger: ^2.5.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
