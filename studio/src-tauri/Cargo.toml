[package]
name    = "sp-smart-studio"
version = "0.1.0"
edition = "2021"
authors = ["SP Smart Broadcast"]
description = "SP Smart Studio — IP-to-Baseband Decoder / Router (Tauri + GStreamer)"

# Tauri exige que o crate seja uma library E um binary
[lib]
name = "sp_smart_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sp-smart-studio"
path = "src/main.rs"

# ──────────────────────────────────────────────────────────────
[dependencies]

# ── Tauri ─────────────────────────────────────────────────────
tauri              = { version = "2.6",  features = ["devtools"] }
tauri-plugin-shell = "2.2"
tauri-plugin-log   = "2.3"

# ── GStreamer ─────────────────────────────────────────────────
# gstreamer-rs v0.23 → GStreamer 1.24+
gstreamer       = "0.23"
gstreamer-video = "0.23"
gstreamer-audio = "0.23"
gstreamer-app   = "0.23"
gstreamer-pbutils = "0.23"

# ── Serialização ──────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# ── Async / Runtime ───────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Logging ───────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Error Handling ────────────────────────────────────────────
thiserror = "2"
anyhow    = "1"

# ── Utilitários ───────────────────────────────────────────────
uuid      = { version = "1", features = ["v4"] }
once_cell = "1"

# ──────────────────────────────────────────────────────────────
[build-dependencies]
tauri-build = { version = "2", features = [] }

# ──────────────────────────────────────────────────────────────
[features]
default         = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ──────────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto       = true
codegen-units = 1
strip     = "symbols"
