name: Build Android APK (SP Smart)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_apk.yml'
      - 'mobile/**'
      - 'server/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de Build (profile = telemetria/performance, release = final)'
        required: true
        default: 'profile'
        type: choice
        options:
          - profile
          - release

jobs:
  build_apk:
    name: Compilar APK (${{ inputs.build_type || 'profile' }})
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'profile' }}

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 🛎️ Checkout do Repositório
        uses: actions/checkout@v5
        with:
          submodules: recursive 

      - name: 🔐 Validar signaling do Termux
        working-directory: ./server
        run: |
          npm ci
          npm run build
          npm run test:termux

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: 📦 Instalar Dependências (Pub Get)
        run: flutter pub get --enforce-lockfile

      - name: 🔎 Validar código Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 🧪 Testar corrida de rota
        run: flutter test test/network/route_selection_test.dart

      - name: 🔨 Compilar APK (NDK + C++ + Dart AOT)
        run: flutter build apk --${{ env.BUILD_TYPE }}

      - name: 📤 Upload do Artifact (APK Final)
        uses: actions/upload-artifact@v4
        with:
          name: sp-smart-mobile-${{ env.BUILD_TYPE }}
          path: mobile/build/app/outputs/flutter-apk/app-${{ env.BUILD_TYPE }}.apk
          retention-days: 7
