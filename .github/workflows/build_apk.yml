name: Build Android APK (SP Smart)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de Build (profile = telemetria/performance, release = final)'
        required: true
        default: 'profile'
        type: choice
        options:
          - profile
          - release

jobs:
  build_apk:
    name: Compilar APK (${{ inputs.build_type }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 🛎️ Checkout do Repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Removido o cache automático do Gradle para evitar o erro anterior

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Gerar Plataforma Android e Injetar C++
        run: |
          # 1. Pede pro Flutter gerar a base do Android do zero
          flutter create --platforms=android .
          
          # 2. Configura CMake, NDK e OpenSSL no Kotlin DSL gerado pelo Flutter
          cat << 'EOF' >> android/app/build.gradle.kts
          
          android {
              ndkVersion = "28.2.13676358"
              buildFeatures {
                  prefab = true
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
          }
          dependencies {
              implementation("com.android.ndk.thirdparty:openssl:1.1.1q-beta-1")
          }
          EOF
          
          # 3. Garante que o app roda em Android 9+, que tem suporte oficial pra H.265
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 28/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 28/g' android/app/build.gradle.kts 2>/dev/null || true

      - name: 📦 Instalar Dependências (Pub Get)
        run: flutter pub get


      - name: 🔨 Compilar APK (NDK + C++ + Dart AOT)
        run: flutter build apk --${{ inputs.build_type }}

      - name: 📤 Upload do Artifact (APK Final)
        uses: actions/upload-artifact@v4
        with:
          name: sp-smart-mobile-${{ inputs.build_type }}
          path: mobile/build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          retention-days: 7
