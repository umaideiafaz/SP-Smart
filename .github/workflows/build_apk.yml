name: Build Android APK (SP Smart)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de Build (profile = telemetria/performance, release = final)'
        required: true
        default: 'profile'
        type: choice
        options:
          - profile
          - release

jobs:
  build_apk:
    name: Compilar APK (${{ inputs.build_type }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: 🛎️ Checkout do Repositório
        uses: actions/checkout@v5
        with:
          submodules: recursive 

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            mobile/android/*.gradle.kts
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: 📦 Instalar Dependências (Pub Get)
        run: flutter pub get --enforce-lockfile

      - name: 🔎 Validar código Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: 🔨 Compilar APK (NDK + C++ + Dart AOT)
        run: flutter build apk --${{ inputs.build_type }}

      - name: 📤 Upload do Artifact (APK Final)
        uses: actions/upload-artifact@v4
        with:
          name: sp-smart-mobile-${{ inputs.build_type }}
          path: mobile/build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          retention-days: 7
